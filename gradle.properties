# Keep local builds usable on a modest desktop. Compile Kotlin in the Gradle
# process rather than retaining a second multi-gigabyte compiler daemon.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ActiveProcessorCount=2
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official

# Consumed by the Light SDK plugin when it generates the application manifest.
sdkVersion=0.1.1
