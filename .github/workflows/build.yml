name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Lightious
        uses: actions/checkout@v4
        with:
          path: lightious

      - name: Checkout companion Light SDK
        uses: actions/checkout@v4
        with:
          repository: LooseWireDev/light-sdk
          ref: 52fbc5a8aedbd3c4c88037580709e53540086229
          path: light-sdk

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build debug APK
        working-directory: lightious
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lightious-debug
          path: lightious/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
