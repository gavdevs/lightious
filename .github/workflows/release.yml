name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout Lightious
        uses: actions/checkout@v4
        with:
          path: lightious

      - name: Checkout companion Light SDK
        uses: actions/checkout@v4
        with:
          repository: LooseWireDev/light-sdk
          ref: 52fbc5a8aedbd3c4c88037580709e53540086229
          path: light-sdk

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches app version
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^versionName *=/ {print $2; exit}' lightious/app/lighttool.toml)"
          if [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "tag $GITHUB_REF_NAME does not match versionName v$version in app/lighttool.toml"
            exit 1
          fi

      - name: Require release signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.LIGHTIOUS_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.LIGHTIOUS_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIGHTIOUS_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LIGHTIOUS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "missing required Lightious release signing secret: $variable"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lightious-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/lightious-release.jks" \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          expected_signer="$(keytool -exportcert \
            -keystore "$RUNNER_TEMP/lightious-release.jks" \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" \
            | sha256sum | awk '{print $1}')"
          echo "EXPECTED_SIGNER_SHA256=$expected_signer" >> "$GITHUB_ENV"

      - name: Run tests and build signed release APK
        working-directory: lightious
        env:
          LIGHTIOUS_RELEASE_KEYSTORE: ${{ runner.temp }}/lightious-release.jks
          LIGHTIOUS_RELEASE_STORE_PASSWORD: ${{ secrets.LIGHTIOUS_RELEASE_STORE_PASSWORD }}
          LIGHTIOUS_RELEASE_KEY_ALIAS: ${{ secrets.LIGHTIOUS_RELEASE_KEY_ALIAS }}
          LIGHTIOUS_RELEASE_KEY_PASSWORD: ${{ secrets.LIGHTIOUS_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: Verify and prepare release artifact
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^versionName *=/ {print $2; exit}' lightious/app/lighttool.toml)"
          version_code="$(awk '/^versionCode *=/ {gsub(/[^0-9]/, ""); print; exit}' lightious/app/lighttool.toml)"
          source_apk="lightious/app/build/outputs/apk/release/app-release.apk"
          artifact="lightious-v${version}-vc${version_code}.apk"
          mkdir -p lightious/dist
          cp "$source_apk" "lightious/dist/$artifact"

          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$apksigner" verify --verbose --print-certs "lightious/dist/$artifact" \
            > "$RUNNER_TEMP/apksigner.txt"

          badging="$("$aapt" dump badging "lightious/dist/$artifact" | head -n 1)"
          if [[ "$badging" != *"name='com.loosewire.lightious'"* ]] || \
             [[ "$badging" != *"versionCode='$version_code'"* ]] || \
             [[ "$badging" != *"versionName='$version'"* ]]; then
            echo "release APK identity does not match app/lighttool.toml"
            echo "$badging"
            exit 1
          fi

          sha="$(sha256sum "lightious/dist/$artifact" | awk '{print $1}')"
          signer="$(awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}' "$RUNNER_TEMP/apksigner.txt")"
          if [ -z "$signer" ]; then
            echo "could not read signer certificate digest"
            exit 1
          fi
          normalized_signer="$(printf '%s' "$signer" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ "$normalized_signer" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo "release APK signer does not match the configured Lightious release key"
            exit 1
          fi

          echo "$sha  $artifact" > lightious/dist/checksums.txt
          {
            echo "Install or upgrade on a Light Phone III with: \`adb install -r $artifact\`."
            echo
            echo "APK SHA-256: \`$sha\`"
            echo
            echo "Signer certificate SHA-256: \`$signer\`"
            echo
            echo "Lightious is an experimental, unofficial Light SDK tool for sideloading."
          } > lightious/dist/release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Lightious ${{ github.ref_name }}
          body_path: lightious/dist/release-notes.md
          files: |
            lightious/dist/*.apk
            lightious/dist/checksums.txt
          generate_release_notes: true
